<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
   <title>RoboCell Tycoon 2.5D</title>
   <link rel="icon" href="data:," />
   <!-- Carga de Phaser 4 vía CDN -->
   <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
   <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
      body { background: #000000; display: flex; justify-content: center; align-items: center;
             position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none;
             -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* En un teléfono vertical el juego queda diminuto: se pide girarlo (el juego es de 16:9). */
      #girar { display: none; position: fixed; inset: 0; z-index: 10; background: #161b22; color: #e6edf3;
               font-family: Arial, sans-serif; text-align: center; align-items: center; justify-content: center;
               flex-direction: column; padding: 24px; font-size: 20px; line-height: 1.4; }
      #girar b { font-size: 56px; display: block; margin-bottom: 12px; }
      @media (orientation: portrait) and (max-width: 700px), (orientation: portrait) and (pointer: coarse) and (max-width: 1024px) { #girar { display: flex; } }
      /* El contenedor ocupa el área visible real (no 100vh: en el celular 100vh incluye la barra del navegador y
         el juego centrado se cortaba arriba y abajo) y respeta la muesca. En PC los márgenes seguros valen 0. */
      #game-container { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
                        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
      #game-container canvas { display: block; }
   </style>
</head>
<body>
   <div id="game-container"></div>
   <div id="girar"><div><b>&#8635;</b>Gira el celular a horizontal para jugar RoboCell Tycoon 2.5D.</div></div>
   <script type="module" src="./src/main.js"></script>
</body>
</html>
